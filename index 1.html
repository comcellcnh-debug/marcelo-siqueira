  <meta name="theme-color" content="#101114">
  <meta name="description" content="Marcelo Siqueira — Especialista em Defesa Administrativa de Trânsito. Multas, suspensão, cassação e bafômetro.">
  <title>Marcelo Siqueira | Links</title>
  <style>
    :root { color-scheme: dark; --gold:#c7a66a; --muted:#b8b8bd; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:34px 18px;
      display:flex; justify-content:center; align-items:center;
      background: radial-gradient(ellipse at 50% 0%, #29251f 0%, #151619 42%, #0b0c0e 100%);
      color:#f7f5f1; font-family:Arial, Helvetica, sans-serif;
    }
    .page { width:100%; max-width:460px; text-align:center; }
    .portrait {
      width:148px; height:148px; object-fit:cover; object-position:center 28%;
      border-radius:50%; border:3px solid var(--gold);
      box-shadow:0 0 0 7px rgba(199,166,106,.10), 0 12px 35px rgba(0,0,0,.45);
    }
    h1 { margin:22px 0 8px; font-size:29px; letter-spacing:.4px; }
    .role { margin:0 auto; max-width:360px; color:#e2d7c5; font-size:15px; line-height:1.55; }
    .specialties { margin:12px 0 28px; color:var(--muted); font-size:12px; letter-spacing:.7px; line-height:1.7; }
    .links { display:grid; gap:13px; }
    a {
      display:flex; align-items:center; justify-content:center; gap:11px;
      min-height:58px; padding:15px 18px; border-radius:13px;
      text-decoration:none; font-weight:700; font-size:15px;
      color:#f8f6f1; background:rgba(255,255,255,.055);
      border:1px solid rgba(199,166,106,.42);
      transition:transform .18s ease, background .18s ease;
    }
    a:hover { transform:translateY(-2px); background:rgba(199,166,106,.14); }
    a.primary { background:linear-gradient(135deg,#b9965a,#8f7040); color:#171513; border:0; }
    .symbol { width:22px; font-size:19px; }
    footer { margin-top:30px; color:#85858b; font-size:11px; letter-spacing:1.5px; }
    .line { width:52px; height:1px; background:var(--gold); margin:25px auto 18px; opacity:.7; }
    @media (max-width:380px) { h1 {font-size:25px;} .portrait {width:132px;height:132px;} }
  </style>
